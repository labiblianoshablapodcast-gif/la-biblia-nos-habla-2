name: Import Qeqchi Full Bible

on:
  push:
    branches:
      - feature/qeqchi-full-bible-2019
    paths:
      - scripts/import_qeqchi_full_bible.py
      - .github/workflows/import-qeqchi-full.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/import_qeqchi_full_bible.py
      - .github/workflows/import-qeqchi-full.yml

permissions:
  contents: write

jobs:
  import-bible:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser
        run: pip install beautifulsoup4

      - name: Import Li Santil Hu
        run: python scripts/import_qeqchi_full_bible.py

      - name: Commit generated Bible data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/qeqchi lib/qeqchi-data.ts
          if git diff --cached --quiet; then
            echo "No changes generated"
            exit 0
          fi
          git commit -m "Importar Li Santil Hu completa desde Scripture Earth"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
